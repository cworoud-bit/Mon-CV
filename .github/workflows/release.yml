name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npx --yes semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom-release:
    name: SBOM attaché à la release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construire les images
        run: |
          docker build -t devsecops-api:release ./api
          docker build -t devsecops-portfolio:release ./devsecops-portfolio
      - name: Générer les SBOM
        run: |
          for IMG in devsecops-api devsecops-portfolio; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/syft:latest $IMG:release -o spdx-json > sbom-$IMG.spdx.json
          done
      - name: Attacher à la dernière release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" sbom-*.spdx.json --clobber
