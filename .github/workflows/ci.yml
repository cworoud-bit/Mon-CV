name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Q76 : permissions minimales pour tout le workflow
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [devsecops-portfolio, api]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm test

  secrets:
    name: Scan des secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest \
            detect --source /repo --log-opts="HEAD" --redact --no-banner --verbose

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          docker run --rm -v "$PWD":/src semgrep/semgrep:latest \
            semgrep scan --config p/javascript --config p/typescript \
            --config p/nodejs --config p/owasp-top-ten \
            --severity ERROR --error --metrics=off \
            --exclude node_modules --exclude .next \
            /src/api /src/devsecops-portfolio

  dependencies:
    name: Dépendances (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: api
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: devsecops-portfolio

  images:
    name: Build et scan des images (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [tests, secrets, sast, dependencies]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: devsecops-api
            context: ./api
          - image: devsecops-portfolio
            context: ./devsecops-portfolio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} ${{ matrix.context }}
      - name: SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false
      - name: Conserver le SBOM comme artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
      - name: Scan Trivy (échec si CRITICAL)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master au 2026-11-11
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  integration:
    name: Tests d'intégration (Floci)
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci
        ports:
          - 4566:4566
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Attendre Floci
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:4566/ > /dev/null && exit 0
            sleep 2
          done
          echo "Floci ne répond pas" && exit 1
      - name: Tests d'intégration Floci (sans compte AWS)
        run: node --test tests/integration/floci.integration.js
