name: Deploy (verification de signature)

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image a verifier (ex. ghcr.io/cworoud-bit/devsecops-api@sha256:...)"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  verify-and-deploy:
    name: Verifier la signature puis livrer
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Connexion a ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Verifier la signature (bloquant)
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity-regexp 'https://github.com/cworoud-bit/Mon-CV/.github/workflows/publish.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Livraison
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          echo "Signature valide : livraison autorisee pour $IMAGE"
