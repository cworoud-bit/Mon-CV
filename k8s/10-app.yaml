apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: devsecops-portfolio }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: devsecops-portfolio:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 3000 }]
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef: { name: portfolio-config, key: API_URL }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: devsecops-portfolio }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: devsecops-api:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: portfolio-config }
            - secretRef: { name: portfolio-secret }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: devsecops-portfolio }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: devsecops-portfolio }
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 4000 }]
