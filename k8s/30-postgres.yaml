apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-pvc, namespace: devsecops-portfolio }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: devsecops-portfolio }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext: { fsGroup: 70 }
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext: { runAsUser: 70, runAsGroup: 70, allowPrivilegeEscalation: false, appArmorProfile: { type: Unconfined } }
          ports: [{ containerPort: 5432 }]
          envFrom:
            - configMapRef: { name: portfolio-config }
            - secretRef: { name: portfolio-secret }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: devsecops-portfolio }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
